# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: orgen

# Two build IDs, one per arch, each emitting linux/darwin/windows. Pure Go
# (CGO_ENABLED=0) so the host cross-compiles every target freely. Unlike
# clawker there are no shared go:embed staging paths, so no build hooks and no
# `--parallelism 1` requirement.
builds:
  - id: orgen-amd64
    main: ./cmd/orgen
    binary: orgen
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
    flags:
      - -trimpath
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w
      - -X github.com/schmitthub/openrouter-generate/internal/build.Version={{.Version}}
      - -X github.com/schmitthub/openrouter-generate/internal/build.Date={{.CommitDate}}
      - -X github.com/schmitthub/openrouter-generate/internal/build.Revision={{.FullCommit}}

  - id: orgen-arm64
    main: ./cmd/orgen
    binary: orgen
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - arm64
    flags:
      - -trimpath
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w
      - -X github.com/schmitthub/openrouter-generate/internal/build.Version={{.Version}}
      - -X github.com/schmitthub/openrouter-generate/internal/build.Date={{.CommitDate}}
      - -X github.com/schmitthub/openrouter-generate/internal/build.Revision={{.FullCommit}}

archives:
  - id: default
    # Both build IDs feed this single archive set so we get one archive per
    # (os, arch) regardless of which build ID produced the binary.
    ids:
      - orgen-amd64
      - orgen-arm64
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

# Publishing to a homebrew tap needs a HOMEBREW_TAP_GITHUB_TOKEN secret and a
# schmitthub/homebrew-tap repository. Uncomment (and wire the secret through
# release.yml -> release-build.yml) once both exist; goreleaser hard-fails the
# whole release if the token is missing.
#
# homebrew_casks:
#   - name: orgen
#     ids: [default]
#     binaries: [orgen]
#     repository:
#       owner: schmitthub
#       name: homebrew-tap
#       token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
#     homepage: https://github.com/schmitthub/openrouter-generate
#     description: "Generate images with OpenRouter image models"
#     license: "MIT"
#     hooks:
#       post:
#         install: |
#           if OS.mac?
#           system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/orgen"]
#           end

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

sboms:
  - artifacts: archive

# Keyless Sigstore signature over checksums.txt. Verify with:
#   cosign verify-blob --bundle checksums.txt.sigstore.json \
#     --certificate-identity-regexp '^https://github\.com/schmitthub/openrouter-generate/\.github/workflows/release-build\.yml@' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com checksums.txt
signs:
  - cmd: cosign
    artifacts: checksum
    output: true
    signature: "${artifact}.sigstore.json"
    args:
      - "sign-blob"
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: schmitthub
    name: openrouter-generate
  prerelease: auto
  name_template: "{{.ProjectName}} v{{.Version}}"
