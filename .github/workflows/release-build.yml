name: Release Build

# Reusable workflow that owns the build + attest steps. Tag validation lives in
# the caller (.github/workflows/release.yml); this file is invoked once per
# release after the caller's checks pass.
#
# SLSA Build Level 3 isolation: the Sigstore signing identity baked into the
# Fulcio cert's SAN URI anchors to THIS file's path+ref, NOT the caller's. The
# caller cannot inject steps into this job's context. Verify attestations
# against this workflow's identity:
#
#   gh attestation verify <artifact> --owner schmitthub \
#     --signer-workflow schmitthub/openrouter-image-cli/.github/workflows/release-build.yml
#
# Permissions are declared on the calling job in release.yml (reusable
# workflows inherit job permissions, not workflow-level permissions).

on:
  workflow_call:

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "v2.15.4"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Stage every attestation subject under release-subjects/ with the final
      # name we want to appear in the attestation. actions/attest derives the
      # subject name from each file's basename, so renaming is the only way to
      # surface version/os/arch in the SLSA statement.
      #
      # Subjects (12 total):
      #   - 6 release archives ({linux,darwin,windows} x {amd64,arm64}) —
      #     goreleaser already names them correctly, copied as-is.
      #   - 6 standalone binaries from goreleaser dist/. Redundant with the
      #     archives (same bytes) but lets forensics verify a loose `orimage`
      #     binary by digest without unpacking.
      #
      # Goreleaser dist/ binary layout: dist/<build-id>_<goos>_<goarch>[_<variant>]/orimage
      # The trailing `*` glob in cp covers the GOAMD64/GOARM64 variant suffix
      # (e.g. `_v1`, `_v8.0`) which differs across goreleaser versions.
      - name: Stage attestation subjects
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          SUBJECTS=release-subjects
          rm -rf "$SUBJECTS"
          mkdir -p "$SUBJECTS"

          cp dist/orimage_*.tar.gz dist/orimage_*.zip "$SUBJECTS/"

          cp dist/orimage-amd64_linux_amd64*/orimage       "${SUBJECTS}/orimage_${VERSION}_linux_amd64"
          cp dist/orimage-amd64_darwin_amd64*/orimage      "${SUBJECTS}/orimage_${VERSION}_darwin_amd64"
          cp dist/orimage-amd64_windows_amd64*/orimage.exe "${SUBJECTS}/orimage_${VERSION}_windows_amd64.exe"
          cp dist/orimage-arm64_linux_arm64*/orimage       "${SUBJECTS}/orimage_${VERSION}_linux_arm64"
          cp dist/orimage-arm64_darwin_arm64*/orimage      "${SUBJECTS}/orimage_${VERSION}_darwin_arm64"
          cp dist/orimage-arm64_windows_arm64*/orimage.exe "${SUBJECTS}/orimage_${VERSION}_windows_arm64.exe"

          ls -la "$SUBJECTS"

      # Single attestation covering all staged subjects. actions/attest@v4
      # auto-generates an SLSA v1 build provenance predicate from GitHub Actions
      # context (source commit, workflow ref, builder ID, runner environment).
      # SBOMs are emitted by goreleaser/syft as release assets and the checksum
      # file is cosign-signed; neither needs a separate attestation.
      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-subjects/*
